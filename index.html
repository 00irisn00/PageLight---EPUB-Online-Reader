<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PageLight - EPUB Online Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Noto+Serif+TC:wght@400;700&family=Noto+Sans:wght@400;600&family=Noto+Sans+TC:wght@400;600&family=Literata:ital,wght@0,400;0,700;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#f3f5f4;--panel:#fff;--ink:#1b2420;--muted:#5d6b66;--line:#d5dcd8;--accent:#1d6a63;--accent-ink:#fff;
  --fs:19px;--lh:1.9;
  --serif:"Noto Serif","Noto Serif TC","Times New Roman","PMingLiU",serif;
  --sans:"Noto Sans","Noto Sans TC","Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
  --ff:var(--serif);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="white"]{--bg:#fff;--panel:#f5f5f4;--ink:#1c1c1c;--muted:#6a6a6a;--line:#e2e2e0;--accent:#2b5fc7;--accent-ink:#fff}
:root[data-theme="parchment"]{--bg:#efe2c3;--panel:#f7edd5;--ink:#3b2f1e;--muted:#7a6748;--line:#d9c79f;--accent:#8a4b1f;--accent-ink:#fff}
:root[data-theme="night"]{--bg:#0d0e0e;--panel:#171918;--ink:#d9dcd8;--muted:#8b918c;--line:#2a2d2b;--accent:#6bc4b9;--accent-ink:#0f1513;color-scheme:dark}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){--bg:#0d0e0e;--panel:#171918;--ink:#d9dcd8;--muted:#8b918c;--line:#2a2d2b;--accent:#6bc4b9;--accent-ink:#0f1513;color-scheme:dark}
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);display:flex;flex-direction:column}
button,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.4rem .75rem;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.4rem .5rem}
header{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;background:var(--panel);border-bottom:1px solid var(--line)}
header .title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
header .title small{font-weight:400;color:var(--muted);margin-inline-start:.5rem}
main{flex:1;min-height:0;display:flex;position:relative}
#toc{width:290px;flex:none;overflow:auto;background:var(--panel);border-inline-end:1px solid var(--line);padding:.75rem 0}
#toc h2{margin:0 1rem .5rem;font-size:.9rem;color:var(--muted);font-weight:600}
#toc a{display:block;padding:.35rem 1rem;color:var(--ink);text-decoration:none;font-size:.92rem;line-height:1.4;border-inline-start:3px solid transparent}
#toc a:hover{background:var(--bg)}
#toc a.on{border-inline-start-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
#reader{flex:1;overflow:auto;scroll-behavior:auto}
.book{font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);max-width:36em;margin:0 auto;padding:2.5rem 1.25rem 3rem;overflow-wrap:break-word;font-kerning:normal;text-rendering:optimizeLegibility}
.book p{margin:0 0 1em}
.book h1,.book h2,.book h3,.book h4{line-height:1.4;margin:1.6em 0 .7em}
.book img,.book svg{max-width:100%;height:auto}
.book table{display:block;overflow-x:auto}
.book a{color:var(--accent)}
.book blockquote{margin:1em 0;padding-inline-start:1em;border-inline-start:3px solid var(--line);color:var(--muted)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:.5rem;max-width:36em;margin:0 auto;padding:0 1.25rem 4rem;font-family:var(--sans)}
.pager span{color:var(--muted);font-size:.9rem}
#empty{margin:auto;max-width:30rem;padding:2rem;text-align:center}
#empty .zone{border:2px dashed var(--line);border-radius:12px;padding:2.5rem 1.5rem;background:var(--panel)}
#empty.over .zone{border-color:var(--accent)}
#empty p{margin:0 0 1.25rem;font-size:1.05rem}
#empty small{display:block;margin-top:1rem;color:var(--muted)}
#msg{color:#b3261e;margin-top:1rem;min-height:1.4em}
:root[data-theme="night"] #msg{color:#ff8a80}
#settings{position:absolute;inset-block-start:.5rem;inset-inline-end:.75rem;z-index:5;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#settings label{display:block;margin-bottom:.9rem;font-size:.9rem;color:var(--muted)}
#settings label:last-child{margin-bottom:0}
#settings input[type=range]{width:100%;accent-color:var(--accent)}
#settings select{width:100%;margin-top:.25rem}
#settings .fld{margin-bottom:.9rem;font-size:.9rem;color:var(--muted)}
.gr{display:flex;gap:.4rem;margin-top:.3rem}
#settings .gr input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.3rem .45rem}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.35rem}
.sw button{display:flex;align-items:center;gap:.45rem;padding:.35rem .5rem;font-size:.85rem;color:var(--ink)}
.sw button::before{content:"";width:1rem;height:1rem;border-radius:50%;border:1px solid var(--line);background:var(--c);flex:none}
.sw button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sw [data-th=mist]{--c:#1d6a63}.sw [data-th=white]{--c:#fff}.sw [data-th=parchment]{--c:#efe2c3}.sw [data-th=night]{--c:#0d0e0e}
#logo{display:flex;color:var(--accent);cursor:pointer}
#logo:hover{opacity:.8}
.title:not(.rd){cursor:pointer}
#logo svg{width:26px;height:26px}
#brand{margin-bottom:1.25rem;color:var(--accent)}
#brand svg{width:56px;height:56px}
#brand h1{margin:.4rem 0 0;font-size:1.5rem;color:var(--ink)}
button:active:not(:disabled){transform:translateY(1px)}
button[aria-pressed="true"],.card.on,button.hit,.card.hit,#toc a.hit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card.on h3,.card.on small,.card.hit h3,.card.hit small{color:var(--accent-ink)}
.card.on select,.card.on button,.card.hit select,.card.hit button{color:var(--ink)}
button:active:not(:disabled),.card:active{background:var(--accent);color:var(--accent-ink)}
button[aria-pressed="true"]{font-weight:600}
.pager{justify-content:center}
.pager button{white-space:nowrap}
.br{flex-basis:100%;height:0;margin-top:-.5rem}
.lpager{display:flex;flex-direction:column;align-items:center;gap:.6rem;margin-bottom:1rem}
#lJump{display:flex;align-items:center;gap:.6rem;font-size:.9rem}
#lPos{cursor:pointer;border-bottom:1px dotted var(--muted);min-width:4.5rem;text-align:center}
#lPrev::before{content:"« "}
#lNext::after{content:" »"}
.pgbox{display:flex;align-items:center;gap:.6rem;padding:.45rem .7rem;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.pgbox button:not(.hit):not(:active){background:var(--bg)}
#pos{cursor:pointer;border-bottom:1px dotted var(--muted);min-width:4.5rem;text-align:center}
#jump{flex-basis:100%;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:.5rem .9rem;font-size:.9rem}
#jump label,#lJump label{display:flex;align-items:center;gap:.4rem;color:var(--muted)}
#jump input,#lJump input{width:5.5rem;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.3rem .45rem}
#prev::before{content:"« "}
#next::after{content:" »"}
#doneBtn::before{content:"☑︎ "}
#bmBtn::before{content:"📥 "}
.pager{flex-wrap:wrap}
#lib{max-width:60rem;margin:0 auto;padding:0 1.25rem 3rem}
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.6rem;margin-bottom:1.25rem}
#stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem}
#stats b{display:block;font-size:1.35rem;color:var(--accent)}
#stats span{font-size:.82rem;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.8rem;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.9rem;cursor:pointer;display:flex;flex-direction:column;gap:.5rem;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.card h3{margin:0;font-size:1rem;line-height:1.4}
.card small{color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.card .row{display:flex;gap:.4rem;align-items:center}
.card .row small{margin-inline-start:auto}
.card select,.card .rm{font-size:.82rem;padding:.2rem .4rem}
.card select{min-width:0;flex:1}
.tools{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.cov{aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:color-mix(in srgb,var(--accent) 14%,var(--bg));display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:var(--accent);font-family:var(--serif)}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.cov.ph{background:hsl(var(--h) 38% 34%);color:#fff;padding:.8rem;text-align:center;font-size:1rem;line-height:1.45;font-weight:600}
.cov.ph span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:12;overflow:hidden;overflow-wrap:anywhere}
#heat{margin-bottom:1.25rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.8rem .9rem}
#heat .tabs{align-items:center;margin-bottom:.7rem}
#heat strong{margin-inline:.4rem}
.hscroll{overflow-x:auto;padding-bottom:.3rem}
.heat{display:grid;gap:3px}
.hm7{grid-template-columns:repeat(7,1fr);max-width:340px}
.hm7 small{text-align:center;color:var(--muted)}
.hmy{grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px}
.hc{border-radius:3px;background:var(--line)}
.hm7 .hc{aspect-ratio:1;font-size:.7rem;padding:2px 4px;color:var(--muted)}
.hc.l1{background:color-mix(in srgb,var(--accent) 25%,var(--panel))}
.hc.l2{background:color-mix(in srgb,var(--accent) 48%,var(--panel))}
.hc.l3{background:color-mix(in srgb,var(--accent) 74%,var(--panel));color:var(--accent-ink)}
.hc.l4{background:var(--accent);color:var(--accent-ink)}
#heat>small{display:block;margin-top:.5rem;color:var(--muted)}
#detail{max-width:56rem;margin:0 auto;padding:1rem 1.25rem 3rem}
.dwrap{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:1.5rem;margin-top:1rem}
.dcov{position:relative;align-self:start}
.dcov .go{position:absolute;inset-inline:.6rem;bottom:.6rem;width:calc(100% - 1.2rem)}
.dinfo{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.dinfo h2{margin:0;font-size:1.5rem;line-height:1.35}
.dinfo small{color:var(--muted)}
.dinfo .fld>span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.25rem}
.dinfo input,.dinfo textarea,.dinfo select{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.45rem .55rem;font:inherit}
.dinfo textarea{min-height:7rem;resize:vertical}
.bms{display:flex;flex-direction:column;gap:.35rem}
.bms div{display:flex;gap:.4rem}
.bms div button:first-child{flex:1;text-align:start}
@media (max-width:640px){.dwrap{grid-template-columns:1fr}.dcov{max-width:220px}}
.hide{display:none!important}
@media (max-width:800px){
  #toc{position:absolute;inset-block:0;inset-inline-start:0;z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  header .title small{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

    <section id="lib" class="hide">

      <div id="heat"></div>
      <div class="tabs" id="tabs" role="group"></div>

    <section id="detail" class="hide"></section>

  </div>
  <div id="settings" class="hide">
    <label><span data-i="size">Text size</span><input type="range" id="fsR" min="14" max="30" step="1"></label>

    <div class="fld"><span data-i="gopct">Go to %</span><div class="gr"><input id="sPc" type="number" min="0" max="100" inputmode="numeric" placeholder="0–100"><button id="sGo" data-i="go">Go</button></div></div>
    <div class="fld"><span data-i="theme">Theme</span><div class="sw" id="thS" role="group"><button data-th="mist" data-i="mist">Mist</button><button data-th="white" data-i="white">White</button><button data-th="parchment" data-i="parchment">Parchment</button><button data-th="night" data-i="night">Night</button></div></div>
  </div>
</main>
<input type="file" id="file" accept=".epub,application/epub+zip" multiple class="hide">

const dirOf = p => p.includes("/") ? p.slice(0, p.lastIndexOf("/") + 1) : "";
function resolve(base, rel){
  let r; try { r = decodeURIComponent(rel); } catch(e){ r = rel; }
  const out = [];
  (dirOf(base) + r).split("/").forEach(s => { if (s === "..") out.pop(); else if (s && s !== ".") out.push(s); });
  return out.join("/");
}
const xml = s => new DOMParser().parseFromString(s, "application/xml");
const ns = (d, n) => [...d.getElementsByTagNameNS("*", n)];
const MIME = {jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",gif:"image/gif",svg:"image/svg+xml",webp:"image/webp"};

/* ---------- open & parse ---------- */
async function openFile(file, fid, at){
  const msg = $("#msg"); msg.textContent = t("loading");
  try {
    const zip = await JSZip.loadAsync(file);
    const enc = zip.file("META-INF/encryption.xml");
    if (enc) {
      const x = await enc.async("string");
      const rest = x.replace(/Algorithm="http:\/\/www\.idpf\.org\/2008\/embedding"/g,"").replace(/Algorithm="http:\/\/ns\.adobe\.com\/pdf\/enc#RC"/g,"");
      if (/Algorithm=/.test(rest)) throw new Error("drm");
    }
    const container = xml(await zip.file("META-INF/container.xml").async("string"));
    const opfPath = ns(container, "rootfile")[0].getAttribute("full-path");
    const opf = xml(await zip.file(opfPath).async("string"));
    const items = {};
    ns(opf, "item").forEach(i => { items[i.getAttribute("id")] = {path: resolve(opfPath, i.getAttribute("href")), type: i.getAttribute("media-type"), props: i.getAttribute("properties") || ""}; });
    const types = {}; Object.values(items).forEach(i => types[i.path] = i.type);
    const spine = ns(opf, "itemref").map(r => items[r.getAttribute("idref")]).filter(Boolean);
    if (!spine.length) throw new Error("empty");
    const meta = n => { const e = ns(opf, n)[0]; return e ? e.textContent.trim() : ""; };
    const idx = {}; spine.forEach((s, i) => idx[s.path] = i);
    book = {zip, spine, idx, types, title: meta("title") || (file.name || "").replace(/\.epub$/i, "") || t("untitled"), author: meta("creator"), lang: meta("language") || "", toc: []};
    book.toc = await buildToc(opf, items, spine);
    $("#detail").classList.add("hide"); inDetail = false; $("#empty").classList.add("hide"); $("#lib").classList.add("hide"); $("#libBtn").classList.remove("hide"); $("#content").classList.remove("hide"); $("#pager").classList.remove("hide");
    $("#tocBtn").classList.remove("hide"); $("#toc").classList.remove("hide");
    if (innerWidth <= 800) $("#toc").classList.add("hide");
    $("#bookTitle").innerHTML = ""; $("#bookTitle").classList.add("rd"); $("#bookTitle").append(book.title);
    if (book.author) { const s = document.createElement("small"); s.textContent = book.author; $("#bookTitle").append(s); }
    document.title = book.title;
    bid = fid || (file.name + "|" + file.size);
    let r0 = lib.find(b => b.id === bid);
    if (!r0) { r0 = {id: bid, status: "reading", ch: 0, pos: 0, added: Date.now(), secs: 0}; lib.unshift(r0); await fPut(bid, file); }
    Object.assign(r0, {title: book.title, author: book.author, total: spine.length, last: Date.now()});
    if (r0.status === "unread") r0.status = "reading";
    if (!(await fGet("c:" + bid))) { const cb = await coverOf(zip); if (cb) await fPut("c:" + bid, cb); }
    if (!r0.cc) measure(zip).then(m => { if (m) { Object.assign(r0, m); r0.pg = pageAt(r0, r0.ch || 0, r0.pos || 0); save(); } });
    save(); renderToc(); await show(at ? at.ch : r0.ch || 0, "", at ? at.pos : r0.pos || 0);
  } catch (e) {
    $("#msg").textContent = e.message === "drm" ? t("drm") : t("err");
  }
}

async function buildToc(opf, items, spine){
  const list = [];
  const nav = Object.values(items).find(i => /\bnav\b/.test(i.props));
  try {
    if (nav) {
      const d = new DOMParser().parseFromString(await book.zip.file(nav.path).async("string"), "text/html");
      const navs = [...d.querySelectorAll("nav")];
      const n = navs.find(x => (x.getAttribute("epub:type") || "").includes("toc")) || navs[0];
      n.querySelectorAll("a[href]").forEach(a => {
        const [h, f] = a.getAttribute("href").split("#");
        let depth = 0, p = a.parentElement; while (p && p !== n) { if (/^(OL|UL)$/.test(p.tagName)) depth++; p = p.parentElement; }
        list.push({label: a.textContent.trim().replace(/\s+/g," "), path: h ? resolve(nav.path, h) : nav.path, frag: f || "", depth: Math.max(0, depth - 1)});
      });
    } else {
      const ncx = Object.values(items).find(i => i.type === "application/x-dtbncx+xml");
      if (ncx) {
        const d = xml(await book.zip.file(ncx.path).async("string"));
        ns(d, "navPoint").forEach(p => {
          const lab = ns(p, "text")[0], c = ns(p, "content")[0]; if (!lab || !c) return;
          const [h, f] = c.getAttribute("src").split("#");
          let depth = 0, q = p.parentElement; while (q) { if (q.localName === "navPoint") depth++; q = q.parentElement; }
          list.push({label: lab.textContent.trim(), path: resolve(ncx.path, h), frag: f || "", depth});
        });
      }
    }
  } catch (e) {}
  const ok = list.filter(x => x.label && x.path in book.idx);
  return ok.length ? ok : spine.map((s, i) => ({label: (i + 1) + "", path: s.path, frag: "", depth: 0}));
}

function renderToc(){
  const box = $("#tocList"); box.innerHTML = "";
  book.toc.forEach((e, i) => {
    const a = document.createElement("a"); a.href = "#"; a.textContent = e.label; a.style.paddingInlineStart = (1 + e.depth * .9) + "rem"; a.dataset.t = i;
    a.onclick = ev => { ev.preventDefault(); show(book.idx[e.path], e.frag); if (innerWidth <= 800) $("#toc").classList.add("hide"); };
    box.append(a);
  });
}

/* ---------- render a chapter ---------- */
async function dataUrl(path){
  const f = book.zip.file(path); if (!f) return "";
  const ext = path.split(".").pop().toLowerCase();
  return "data:" + (book.types[path] || MIME[ext] || "application/octet-stream") + ";base64," + await f.async("base64");
}

async function show(i, frag, pos){
  if (i == null || i < 0 || i >= book.spine.length) return;
  cur = i;
  const item = book.spine[i];
  { const rr = rec(); if (rr) { rr.ch = i; if (!pos) rr.pos = 0; rr.pg = pageAt(rr, i, pos || 0); save(); } }
  const d = new DOMParser().parseFromString(await book.zip.file(item.path).async("string"), "text/html");
  d.querySelectorAll("script,style,link,iframe,object,embed,form,meta,base,audio,video").forEach(n => n.remove());
  const body = d.body;
  body.querySelectorAll("*").forEach(el => [...el.attributes].forEach(a => { const n = a.name.toLowerCase(); if (n.startsWith("on") || n === "style") el.removeAttribute(a.name); }));
  const jobs = [];
  body.querySelectorAll("img[src]").forEach(im => jobs.push(dataUrl(resolve(item.path, im.getAttribute("src"))).then(u => im.setAttribute("src", u))));
  body.querySelectorAll("image").forEach(im => {
    const h = im.getAttribute("xlink:href") || im.getAttribute("href"); if (!h) return;
    jobs.push(dataUrl(resolve(item.path, h)).then(u => { im.setAttribute("href", u); im.setAttribute("xlink:href", u); }));
  });
  body.querySelectorAll("a[href]").forEach(a => {
    const h = a.getAttribute("href");
    if (/^(https?:|mailto:)/i.test(h)) { a.target = "_blank"; a.rel = "noopener noreferrer"; return; }
    const [p, f] = h.split("#");
    const path = p ? resolve(item.path, p) : item.path;
    if (path in book.idx) { a.dataset.idx = book.idx[path]; a.dataset.frag = f || ""; a.setAttribute("href", "#"); }
    else a.removeAttribute("href");
  });
  await Promise.all(jobs);
  /* Vietnamese: join decomposed letters + tone marks (NFD) into precomposed ones (NFC) */
  const w = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
  while (w.nextNode()) w.currentNode.nodeValue = w.currentNode.nodeValue.normalize("NFC");
  const c = $("#content");
  c.replaceChildren(...body.childNodes);
  c.lang = book.lang || "";
  const r = $("#reader");
  const target = frag ? c.querySelector("[id=\"" + CSS.escape(frag) + "\"]") : null;
  if (target) target.scrollIntoView(); else if (pos) setTimeout(() => { r.scrollTop = pos * Math.max(0, r.scrollHeight - r.clientHeight); }, 80); else r.scrollTop = 0;
  updateNav();
}

function updateNav(){

  { const rr = rec(), tp = rr ? totalPg(rr) : 0; $("#pos").textContent = tp ? Math.min(tp, pageAt(rr, cur, rr.pos || 0)) + " / " + tp : (cur + 1) + " / " + book.spine.length; }
  { const rr = rec(); $("#doneBtn").setAttribute("aria-pressed", !!rr && rr.status === "finished"); }
